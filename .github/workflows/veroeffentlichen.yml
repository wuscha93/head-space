# Bei jedem Push auf main: prüfen, testen, bauen und auf GitHub Pages veröffentlichen.
# Schlägt ein Test fehl, wird NICHTS veröffentlicht (die installierte App bleibt auf der alten Version).
# Einmalig nötig: Repository → Settings → Pages → Source: „GitHub Actions“.
name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typen prüfen
        run: bunx -p typescript@5.8.3 tsc -p .
      - name: Unit-Tests
        run: bun test
      - name: Playwright installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: End-to-End-Tests
        run: tests/run.sh --nur-e2e

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Bauen
        run: bun run build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
