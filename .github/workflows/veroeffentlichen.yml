# Live-App (Branch main)  → https://wuscha93.github.io/head-space/
# Test-App (Branch test)  → https://wuscha93.github.io/head-space/test/
#
# Bei jedem Push auf main oder test wird der gepushte Stand geprüft und getestet.
# Schlägt ein Test fehl, wird NICHTS veröffentlicht.
# Veröffentlicht wird immer aus main (GitHub Pages erlaubt standardmässig nur main):
#   - Push auf main  → testen, dann ganze Website bauen und veröffentlichen
#   - Push auf test  → testen, dann diesen Workflow auf main anstossen (ohne erneute Tests)
# Die Website enthält immer beide Apps: Live aus main, Test aus test.
name: Veröffentlichen

on:
  push:
    branches: [main, test]
  workflow_dispatch:
    inputs:
      nur_bauen:
        description: 'Tests überspringen (bereits beim Push gelaufen)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !inputs.nur_bauen }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typen prüfen
        run: bunx -p typescript@5.8.3 tsc -p .
      - name: Unit-Tests
        run: bun test
      # Browser zwischenspeichern: spart bei jedem Lauf den Download von Chromium
      - name: Playwright-Browser aus dem Zwischenspeicher
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.0-chromium-webkit-${{ runner.os }}
      - name: Playwright installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          # WebKit = Browser-Kern von Safari (iPad/iPhone), für den Knopf-Test
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium webkit
          else
            npx playwright install --with-deps chromium webkit
          fi
      - name: End-to-End-Tests
        run: tests/run.sh --nur-e2e
        env:
          E2E_WEBKIT: '1'

  # Push auf test: nach bestandenen Tests die Veröffentlichung auf main anstossen
  anstossen:
    needs: test
    if: ${{ github.ref == 'refs/heads/test' }}
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run veroeffentlichen.yml --repo "$GITHUB_REPOSITORY" --ref main -f nur_bauen=true
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: test
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - uses: actions/checkout@v4
        with:
          ref: test
          path: test
      - uses: oven-sh/setup-bun@v2
      - name: Website bauen (Live aus main, Test aus test)
        run: live/scripts/build-site.sh "$PWD/live" "$PWD/test"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: live/site

  deploy:
    needs: build
    # always(): sonst überspringt GitHub diesen Schritt, wenn „test“ (bei nur_bauen) übersprungen wurde
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
